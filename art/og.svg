<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- The preview image for links to the site. After a change, render it
       again: rsvg-convert -w 1200 -h 630 art/og.svg -o public/og.png -->
  <defs>
    <radialGradient id="og-heat" cx="0.78" cy="0.05" r="0.75">
      <stop offset="0" stop-color="#f97316" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="og-rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dc2626"/>
      <stop offset="0.42" stop-color="#f97316"/>
      <stop offset="0.75" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#facc15"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="#0c0706"/>
  <rect width="1200" height="630" fill="url(#og-heat)"/>
  <svg x="84" y="150" width="250" height="250" viewBox="0 0 256 256">
  <title>Burnout</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17141A"/>
      <stop offset="1" stop-color="#08070A"/>
    </linearGradient>
    <radialGradient id="heat" cx="0.5" cy="0.5" r="0.52">
      <stop offset="0" stop-color="#F97316" stop-opacity="0.36"/>
      <stop offset="0.55" stop-color="#EA580C" stop-opacity="0.11"/>
      <stop offset="1" stop-color="#EA580C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EF4444"/>
      <stop offset="0.42" stop-color="#F97316"/>
      <stop offset="1" stop-color="#FACC15"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDE047"/>
      <stop offset="1" stop-color="#FFFBEB"/>
    </linearGradient>
    <linearGradient id="tool" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="0.42" stop-color="#CBD5E1"/>
      <stop offset="1" stop-color="#64748B"/>
    </linearGradient>
  </defs>

  <rect width="256" height="256" rx="56" fill="url(#tile)"/>
  <rect width="256" height="256" rx="56" fill="url(#heat)"/>
  <rect x="1" y="1" width="254" height="254" rx="55" fill="none" stroke="#2A2118" stroke-width="2"/>

  <g transform="translate(128 126) scale(1.15) translate(-128 -100)">
    <path fill="url(#flame)" d="M128 30C142 62 163 82 169 108C176 136 166 160 150 170L106 170C90 160 80 136 87 108C91 92 100 82 108 68C111 88 121 94 126 88C132 80 126 50 128 30Z"/>
    <path fill="url(#core)" d="M128 92C136 108 148 120 148 138C148 157 139 168 128 170C117 168 108 157 108 138C108 122 120 110 128 92Z"/>
  </g>

  <g transform="rotate(-40 128 128)" fill="url(#tool)" stroke="#140F0A" stroke-width="5" stroke-linejoin="round">
    <rect x="63" y="119" width="134" height="18" rx="9"/>
    <path fill-rule="evenodd" d="M39 128a26 26 0 1 0 52 0a26 26 0 1 0 -52 0ZM53 128a12 12 0 1 0 24 0a12 12 0 1 0 -24 0Z"/>
    <path d="M177 104L215 104L215 120L196 120Q189 120 189 128Q189 136 196 136L215 136L215 152L177 152Q169 152 169 144L169 112Q169 104 177 104Z"/>
  </g>
</svg>
  <svg x="380" y="170" width="736" height="175" viewBox="0 0 756 180">
  <title>Burnout</title>

  <defs>
    <!-- Ember red through to the pale yellow at the base of a flame. The
         shift runs along the word, so the last letter is the hottest. -->
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0" stop-color="#dc2626"/>
      <stop offset="0.42" stop-color="#f97316"/>
      <stop offset="0.75" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#facc15"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- One scanline, tiled. A rule drawn per line would be a hundred
         elements that all say the same thing. -->
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" opacity="0.28"/>
    </pattern>
  </defs>

  <rect width="756" height="180" rx="16" fill="#0c0706"/>
  <rect x="6" y="6" width="744" height="168" rx="11"
        fill="none" stroke="#f97316" stroke-opacity="0.28" stroke-width="2"/>

  <g filter="url(#glow)">
    <path d="M0 0h12v12h-12zM12 12h12v12h-12zM24 24h12v12h-12zM36 36h12v12h-12zM24 48h12v12h-12zM12 60h12v12h-12zM0 72h12v12h-12z" fill="#f97316" opacity="0.55"
          transform="translate(48 48)"/>
    <path d="M0 0h48v12h-48zM72 0h12v12h-12zM120 0h12v12h-12zM144 0h48v12h-48zM216 0h12v12h-12zM264 0h12v12h-12zM300 0h36v12h-36zM360 0h12v12h-12zM408 0h12v12h-12zM432 0h60v12h-60zM0 12h12v12h-12zM48 12h12v12h-12zM72 12h12v12h-12zM120 12h12v12h-12zM144 12h12v12h-12zM192 12h12v12h-12zM216 12h24v12h-24zM264 12h12v12h-12zM288 12h12v12h-12zM336 12h12v12h-12zM360 12h12v12h-12zM408 12h12v12h-12zM456 12h12v12h-12zM0 24h12v12h-12zM48 24h12v12h-12zM72 24h12v12h-12zM120 24h12v12h-12zM144 24h12v12h-12zM192 24h12v12h-12zM216 24h12v12h-12zM240 24h12v12h-12zM264 24h12v12h-12zM288 24h12v12h-12zM336 24h12v12h-12zM360 24h12v12h-12zM408 24h12v12h-12zM456 24h12v12h-12zM0 36h48v12h-48zM72 36h12v12h-12zM120 36h12v12h-12zM144 36h48v12h-48zM216 36h12v12h-12zM240 36h12v12h-12zM264 36h12v12h-12zM288 36h12v12h-12zM336 36h12v12h-12zM360 36h12v12h-12zM408 36h12v12h-12zM456 36h12v12h-12zM0 48h12v12h-12zM48 48h12v12h-12zM72 48h12v12h-12zM120 48h12v12h-12zM144 48h12v12h-12zM168 48h12v12h-12zM216 48h12v12h-12zM252 48h24v12h-24zM288 48h12v12h-12zM336 48h12v12h-12zM360 48h12v12h-12zM408 48h12v12h-12zM456 48h12v12h-12zM0 60h12v12h-12zM48 60h12v12h-12zM72 60h12v12h-12zM120 60h12v12h-12zM144 60h12v12h-12zM180 60h12v12h-12zM216 60h12v12h-12zM264 60h12v12h-12zM288 60h12v12h-12zM336 60h12v12h-12zM360 60h12v12h-12zM408 60h12v12h-12zM456 60h12v12h-12zM0 72h48v12h-48zM84 72h36v12h-36zM144 72h12v12h-12zM192 72h12v12h-12zM216 72h12v12h-12zM264 72h12v12h-12zM300 72h36v12h-36zM372 72h36v12h-36zM456 72h12v12h-12z" fill="url(#ink)" transform="translate(144 48)"/>
    <rect x="660" y="48" width="48"
          height="84" fill="#fbbf24" opacity="0.85">
      <animate attributeName="opacity" values="0.85;0.85;0.1;0.1;0.85"
               dur="1.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect width="756" height="180" rx="16" fill="url(#scanlines)"
        opacity="0.5" pointer-events="none"/>
</svg>
  <rect x="84" y="452" width="1032" height="4" rx="2" fill="url(#og-rule)"/>
  <text x="84" y="520" fill="#f6efe7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="41" font-weight="700">Writes a bootable USB drive from the command line.</text>
  <text x="84" y="570" fill="#bcad9e" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30">The same two commands on Windows, macOS and Linux.</text>
</svg>
